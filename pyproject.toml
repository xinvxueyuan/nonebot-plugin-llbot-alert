[project]
name = "llbot-alert"
version = "0.1.0"
description = "LLBot 状态告警插件：检测 LLBot 服务异常（OneBot 连接断开）与账号异常（账号下线），通过 SMTP 发送告警邮件"
keywords = ["nonebot2", "nonebot", "llbot", "onebot", "alert", "monitor"]
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = { text = "MIT" }
authors = [
    { name = "xinvxueyuan", email = "xinvxueyuan@yeah.net" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/xinvxueyuan/llbot-alert"
Repository = "https://github.com/xinvxueyuan/llbot-alert"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.16.2",
    "pyright>=1.1.411",
]
test = [
    "nb-cli>=1.7.4",
    "nonebug>=0.4.4",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
]

[tool.nonebot]
plugin_dirs = ["src/plugins"]

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
line-ending = "lf"
preview = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
task-tags = ["TODO", "FIXME", "XXX", "HACK", "BUG", "NOTE"]
select = [
    "F", "W", "E", "I", "C90", "N", "PL", "UP", "YTT", "ANN", "ASYNC",
    "BLE", "FBT", "B", "A", "COM", "C4", "D", "DTZ", "T10", "ICN", "PIE",
    "T20", "PYI", "Q", "RSE", "RET", "SIM", "SLOT", "TID", "TC", "ARG",
    "PTH", "FAST", "PERF", "PGH", "FURB", "TRY", "RUF",
]
ignore = [
    "E402",
    "B008",
    "UP037",
    "ANN202",
    "ANN401",
    "COM812",
    "PLC0415",
    "TID252",
    "D100",
    "D104",
    "D105",
    "D107",
    "D203",
    "D212",
    "D400",
    "D415",
    "D101",
    "D102",
    "D103",
]
allowed-confusables = ["，", "。", "“", "”", "：", "；", "？", "！", "【", "】", "《", "》", "…", "—", "（", "）", "、", "．"]

[tool.ruff.lint.per-file-ignores]
# NoneBot 钩子处理函数的签名注解需要真实运行时类型（注册时解析），
# 不能移入 TYPE_CHECKING。
"src/plugins/nonebot_plugin_llbot_alert/hooks.py" = [
    "TC002",
    "TC003",
]
"tests/**" = [
    "ARG002", "ANN201", "PLR2004", "E501", "F841", "TC002", "TC003", "TC005",
    "TRY003", "ASYNC240", "D100", "D101", "D102", "D103",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = ["nonebot_plugin_llbot_alert"]
force-sort-within-sections = true
combine-as-imports = true

[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingParameterType = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownParameterType = "none"
reportMissingTypeArgument = "none"
reportMissingTypeStubs = "none"
reportUnusedFunction = "none"
reportPrivateUsage = "none"
reportConstantRedefinition = "none"
reportDeprecated = "none"
reportUnnecessaryIsInstance = "none"
include = ["src", "tests"]
exclude = [".venv", "__pycache__", ".ruff_cache", ".pyright", "tmp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/plugins/nonebot_plugin_llbot_alert"]
branch = true

[build-system]
requires = ["uv_build>=0.11.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nonebot_plugin_llbot_alert"]
module-root = "src/plugins"
